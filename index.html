<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Website</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7fb;
            color: #333;
        }

        /* Navigation */
        nav {
            background-color: #2563eb;
            padding: 20px;
            text-align: center;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 0 15px;
            font-size: 18px;
        }

        nav a:hover {
            color: #dbeafe;
        }

        /* Hero Section */
        .hero {
            text-align: center;
            padding: 100px 20px;
            background-color: white;
        }

        .hero h1 {
            font-size: 45px;
            color: #2563eb;
            margin-bottom: 15px;
        }

        .hero p {
            font-size: 20px;
            margin-bottom: 25px;
        }

        .button {
            display: inline-block;
            background-color: #2563eb;
            color: white;
            padding: 12px 25px;
            text-decoration: none;
            border-radius: 6px;
        }

        .button:hover {
            background-color: #1d4ed8;
        }

        /* About Section */
        .about {
            padding: 60px 20px;
            text-align: center;
        }

        .about h2 {
            font-size: 30px;
            margin-bottom: 15px;
        }

        .about p {
            max-width: 600px;
            margin: auto;
            line-height: 1.6;
        }

        /* Footer */
        footer {
            background-color: #111827;
            color: white;
            text-align: center;
            padding: 20px;
            margin-top: 30px;
        }
    </style>
</head>

<body>

    <!-- Navigation -->
    <nav>
        <a href="#">Home</a>
        <a href="#about">About</a>
        <a href="#contact">Contact</a>
    </nav>

    <!-- Hero -->
    <section class="hero">
        <h1>Welcome 👋</h1>
        <p>This is my simple website made with HTML and CSS.</p>
        <a href="#about" class="button">Learn More</a>
    </section>

    <!-- About -->
    <section class="about" id="about">
        <h2>About Me</h2>
        <p>
            Hello! I am learning web development.
            I created this simple website using HTML and CSS
            in a single file.
        </p>
    </section>

    <!-- Contact -->
    <section class="about" id="contact">
        <h2>Contact</h2>
        <p>Email: hello@example.com</p>
    </section>

    <!-- Footer -->
    <footer>
        <p>© 2026 My Website. All rights reserved.</p>
    </footer>

</body>
</html>
